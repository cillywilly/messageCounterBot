spring:
  hibernate:
    connection:
      url: jdbc:postgresql://db:5432/${POSTGRES_DBw}
      driver_class: org.postgresql.Driver
      username: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
    dialect: org.hibernate.dialect.PostgreSQLDialect
    show_sql: true
    format_sql: true
    hbm2ddl:
      auto: none